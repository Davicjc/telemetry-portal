<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Telemetry Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b; --text-main: #fafafa; --text-muted: #a1a1aa;
            --primary: #8b5cf6; --primary-600: #7c3aed; --danger: #ef4444;
            --border: rgba(255,255,255,.08); --border-strong: #27272a;
            --ring: rgba(139,92,246,.55);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif; color: var(--text-main);
            background:
                radial-gradient(900px 520px at 50% -12%, rgba(139,92,246,.30), transparent 60%),
                radial-gradient(640px 460px at 90% 100%, rgba(124,58,237,.16), transparent 60%),
                var(--bg);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { width: 100%; max-width: 400px; animation: rise .6s cubic-bezier(.2,.7,.2,1); }
        .brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 26px; }
        .mark {
            width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
            background: linear-gradient(150deg, var(--primary), var(--primary-600));
            box-shadow: 0 12px 30px -8px rgba(139,92,246,.75), 0 0 0 1px rgba(255,255,255,.08) inset;
        }
        .mark svg { width: 24px; height: 24px; stroke: #fff; }
        .brand b { font-family: 'Space Grotesk'; font-weight: 700; font-size: 20px; display: block; line-height: 1; }
        .brand span { color: var(--text-muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
        .card {
            background: rgba(20,20,24,.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border); border-radius: 18px; padding: 32px;
            box-shadow: 0 30px 60px -24px rgba(0,0,0,.8);
        }
        .card h1 { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .card .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 7px; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .field input {
            width: 100%; padding: 11px 13px; background: rgba(0,0,0,.28);
            border: 1px solid var(--border-strong); border-radius: 10px; color: var(--text-main);
            font-size: 14px; font-family: 'Inter'; outline: none; transition: border-color .16s, box-shadow .16s;
        }
        .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
        .btn {
            width: 100%; margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px;
            font-weight: 600; font-size: 14px; font-family: 'Inter'; cursor: pointer; transition: all .16s ease;
            box-shadow: 0 10px 26px -10px rgba(139,92,246,.9);
        }
        .btn:hover { background: var(--primary-600); }
        .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
        .alert {
            background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.32);
            padding: 11px 14px; border-radius: 10px; margin-bottom: 18px; text-align: center; font-size: 13px;
        }
        .foot { text-align: center; color: #52525b; font-size: 12px; margin-top: 20px; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .wrap { animation: none; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <div class="mark">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4a16 16 0 0 1 16 16"/><path d="M4 11a9 9 0 0 1 9 9"/><circle cx="5" cy="19" r="1.5" fill="#fff" stroke="none"/></svg>
            </div>
            <div><b>Telemetry</b><span>Audicom NOC</span></div>
        </div>

        <div class="card">
            <h1>Bem-vindo de volta</h1>
            <div class="sub">Entre para acompanhar a rede ao vivo.</div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="field">
                    <label>Usuário</label>
                    <input type="text" name="username" required autocomplete="off" autofocus placeholder="seu usuário">
                </div>
                <div class="field">
                    <label>Senha</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>
        <div class="foot">Telemetry Portal · monitoramento OSPF / BFD / Sonda</div>
    </div>
</body>
</html>
